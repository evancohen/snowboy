name: npm package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['14.21.3', '18', '20', '22']
    env:
      npm_config_python: /usr/bin/python3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libatlas-base-dev
      - name: Build and pack release candidate
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run build
          npm pack --ignore-scripts
      - name: Test normal installation from the packed package
        run: |
          mkdir "$RUNNER_TEMP/snowboy-consumer"
          cd "$RUNNER_TEMP/snowboy-consumer"
          npm init -y
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE/snowboy-1.4.0-rc.0.tgz"
          SNOWBOY_CONSUMER=1 node "$GITHUB_WORKSPACE/test/smoke.js"
      - name: Keep tested release candidate
        if: matrix.node == '20'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: snowboy-1.4.0-rc.0
          path: snowboy-1.4.0-rc.0.tgz
          if-no-files-found: error
